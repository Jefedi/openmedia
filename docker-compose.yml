# OpenMedia - Docker Compose (Development)
# Pour la production, utilisez: docker-compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL - Base de données principale
  db:
    image: postgres:15-alpine
    container_name: openmedia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openmedia}
      POSTGRES_USER: ${POSTGRES_USER:-openmedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmedia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openmedia_network

  # Redis - Cache et file d'attente
  redis:
    image: redis:7-alpine
    container_name: openmedia_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - openmedia_network

  # Meilisearch - Moteur de recherche
  search:
    image: getmeili/meilisearch:v1.5
    container_name: openmedia_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY required}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_DB_PATH: /meili_data
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILI_PORT:-17700}:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - openmedia_network

  # API Backend - FastAPI
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    container_name: openmedia_api
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmedia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openmedia}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Meilisearch
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # API
      API_V1_PREFIX: /api/v1
      PROJECT_NAME: OpenMedia
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      # Rate limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-1000}

    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - api_logs:/app/logs
    ports:
      - "${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      search:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - openmedia_network

  # Celery Worker - Tâches asynchrones
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    container_name: openmedia_worker
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=debug --concurrency=2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmedia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openmedia}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./worker/tasks:/app/tasks:ro
      - ./scripts:/app/scripts:ro
      - worker_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - openmedia_network

  # Celery Beat - Tâches planifiées
  beat:
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    container_name: openmedia_beat
    restart: unless-stopped
    command: celery -A tasks.celery_app beat --loglevel=debug
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmedia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openmedia}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./worker/tasks:/app/tasks:ro
    depends_on:
      - redis
      - worker
    networks:
      - openmedia_network

  # Frontend - Next.js (Development mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
    container_name: openmedia_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: OpenMedia
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.js:/app/next.config.js:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    depends_on:
      - api
    networks:
      - openmedia_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  api_logs:
    driver: local
  worker_logs:
    driver: local

networks:
  openmedia_network:
    driver: bridge
